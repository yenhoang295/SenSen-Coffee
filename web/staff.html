<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nhân viên | SENSEN COFFEE</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1>SENSEN COFFEE · Nhân viên</h1>
    <nav><a href="menu.html">Menu</a></nav>
  </header>

  <div class="panel" id="login-panel">
    <h2>Đăng nhập nhân viên</h2>
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Mật khẩu" autocomplete="current-password">
    <button id="login" type="button">Đăng nhập</button>
    <p id="login-msg" class="bad" role="status"></p>
  </div>

  <main class="staff" id="panel" hidden>
    <section class="panel" id="shop-settings">
      <h2>Cài đặt quán</h2>

      <label for="baristas">Số nhân viên pha chế đang làm:</label>
      <select id="baristas">
        <option value="1">1 nhân viên</option>
        <option value="2">2 nhân viên</option>
        <option value="3">3 nhân viên</option>
        <option value="4">4 nhân viên</option>
        <option value="5">5 nhân viên</option>
        <option value="6">6 nhân viên</option>
        <option value="7">7 nhân viên</option>
        <option value="8">8 nhân viên</option>
        <option value="9">9 nhân viên</option>
        <option value="10">10 nhân viên</option>
      </select>

      <button id="save-shop" type="button">Lưu số nhân viên</button>
      <button id="toggle-orders" type="button">Tạm dừng nhận đơn</button>

      <p id="shop-msg" role="status"></p>
    </section>

    <div class="tools">
      <select id="filter">
        <option value="">Tất cả đơn</option>
        <option value="PENDING">Chờ xác nhận</option>
        <option value="CONFIRMED">Đã xác nhận</option>
        <option value="PREPARING">Đang pha chế</option>
        <option value="READY">Sẵn sàng</option>
        <option value="COMPLETED">Hoàn tất</option>
        <option value="REJECTED">Đã từ chối</option>
        <option value="CANCELLED">Đã hủy</option>
      </select>
      <button id="refresh" type="button">Làm mới</button>
      <button id="logout" type="button">Đăng xuất</button>
    </div>

    <p id="panel-msg" class="bad" role="status"></p>
    <p id="empty" hidden>Chưa có đơn nào.</p>
    <div id="orders" class="orders"></div>
  </main>

  <script type="module" src="js/staff.js"></script>
</body>
</html>
