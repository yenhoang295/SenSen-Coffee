<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tài khoản | SENSEN COFFEE</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>
  <header class="top">
    <h1>SENSEN COFFEE</h1>
    <nav><a href="index.html">Trang chủ</a><a href="menu.html">Menu</a></nav>
  </header>
  <div class="panel" id="signed-out">
    <h2>Đăng nhập hoặc đăng ký</h2>
    <input id="full-name" placeholder="Họ tên (khi đăng ký)">
    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Mật khẩu (từ 6 ký tự)" autocomplete="current-password">
    <button id="login" type="button">Đăng nhập</button>
    <button id="register" type="button">Đăng ký</button>
  </div>
  <div class="panel" id="signed-in" hidden>
    <p>Đang đăng nhập: <strong id="who"></strong></p>
    <button id="logout" type="button">Đăng xuất</button>
  </div>
  <p id="message" role="status" style="text-align:center"></p>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/nav.js"></script>
</body>
</html>
